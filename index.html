<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Shruti! 🎂</title>
  <!-- Tailwind CSS & Canvas Confetti -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .handwriting {
      font-family: 'Caveat', cursive;
    }
    body {
      background: linear-gradient(135deg, #ffeef5 0%, #fff0f5 50%, #f3e8ff 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-bubble {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
      animation: floatSlow 12s infinite alternate ease-in-out;
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-50px) scale(1.1); }
    }
    /* Candle Flame Animation */
    .flame {
      background: radial-gradient(ellipse at bottom, #fff 0%, #ffde59 30%, #ff5722 80%);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 15px #ff9800, 0 0 30px #ff5722;
      animation: flicker 0.15s infinite alternate;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
      100% { transform: scale(1.08) rotate(2deg); opacity: 1; }
    }
    .smoke {
      position: absolute;
      width: 10px;
      height: 25px;
      background: rgba(180, 180, 180, 0.6);
      border-radius: 50%;
      filter: blur(4px);
      animation: riseSmoke 1.2s forwards ease-out;
      pointer-events: none;
    }
    @keyframes riseSmoke {
      0% { opacity: 0.8; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(2.5); }
    }
    .pop-in {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    #runawayBtn {
      transition: top 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body class="relative text-gray-800 flex flex-col justify-between">

  <!-- MP3 Audio Elements -->
  <audio id="softAudio" loop src="bgm.mp3" preload="auto"></audio>
  <audio id="hbdAudio" src="hbd.mp3" preload="auto"></audio>

  <!-- Background decorative blurs -->
  <div class="bg-bubble w-72 h-72 bg-pink-200/50 top-[-50px] left-[-50px]"></div>
  <div class="bg-bubble w-96 h-96 bg-purple-200/40 bottom-[-50px] right-[-50px]"></div>

  <!-- Header -->
  <header class="relative z-10 w-full max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
    <div id="secretLogo" onclick="handleSecretTap()" class="flex items-center gap-2 bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-pink-100 cursor-pointer select-none">
      <span class="text-2xl animate-bounce">🐼</span>
      <span class="font-bold text-sm text-pink-600 tracking-wide">Special for Shruti</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleSoundtrack()" id="bgmBtn" class="bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-pink-100 text-pink-600 font-bold text-xs sm:text-sm hover:scale-105 active:scale-95 transition">
        🎵 Music: Off
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="relative z-10 w-full max-w-xl mx-auto px-4 flex-1 flex flex-col justify-center items-center py-6">

    <!-- GATE 1: Initial Birthday Check (Clean First View) -->
    <div id="gate1Card" class="w-full bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl border border-pink-100 text-center pop-in">
      <div class="w-20 h-20 mx-auto mb-4 bg-pink-100 rounded-full flex items-center justify-center text-4xl shadow-inner">
        🎂
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-800 mb-2">
        Is your birthday today, Shruti? ✨
      </h2>
      <p class="text-gray-500 text-sm mb-6">
        Let's verify before unlocking something super special!
      </p>

      <div class="flex gap-4 justify-center items-center">
        <button onclick="verifyBirthday(true)" class="flex-1 max-w-[150px] bg-gradient-to-r from-pink-500 to-rose-400 hover:from-pink-600 hover:to-rose-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-pink-200 hover:scale-105 active:scale-95 transition">
          Yes 🎂
        </button>
        <button onclick="verifyBirthday(false)" class="flex-1 max-w-[150px] bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3.5 px-6 rounded-2xl border border-gray-200 active:scale-95 transition">
          No 🙈
        </button>
      </div>
    </div>

    <!-- GATE 2: Nickname Security Quiz -->
    <div id="gate2Card" class="w-full bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl border border-pink-100 text-center hidden pop-in">
      <div class="w-20 h-20 mx-auto mb-4 bg-purple-100 rounded-full flex items-center justify-center text-4xl shadow-inner">
        🔐
      </div>
      <div class="inline-block bg-pink-100 text-pink-600 font-bold text-xs px-3 py-1 rounded-full uppercase tracking-wider mb-2">
        Security Question
      </div>
      <h2 class="text-2xl font-extrabold text-gray-800 mb-2">
        What do I call you generally? 🤫
      </h2>
      <p class="text-gray-500 text-sm mb-6">
        Choose wisely! Intruders will be caught immediately.
      </p>

      <div class="grid grid-cols-2 gap-3 max-w-md mx-auto">
        <button onclick="checkAnswer('panda')" class="bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold py-3.5 px-4 rounded-2xl border border-pink-200 hover:scale-102 active:scale-95 transition">
          panda
        </button>
        <button onclick="checkAnswer('o+')" class="bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold py-3.5 px-4 rounded-2xl border border-pink-200 hover:scale-102 active:scale-95 transition">
          o+
        </button>
        <button onclick="checkAnswer('shruti')" class="bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold py-3.5 px-4 rounded-2xl border border-pink-200 hover:scale-102 active:scale-95 transition">
          shruti
